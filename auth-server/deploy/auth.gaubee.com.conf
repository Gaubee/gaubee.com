# auth.gaubee.com vhost —— 自托管登录服务（2026-10-18 kzf 裁决：登录/上传迁国内服务器）
# 放置于 /opt/1panel/apps/openresty/openresty/conf/conf.d/auth.gaubee.com.conf
# 证书：复用 gaubee.com 站点泛域名证书 *.gaubee.com（无需新签）
# 注意：server_name 具体名优先级高于 gaubee.com.conf 的通配 *.gaubee.com，不会互相抢
server {
    listen 80;
    listen 443 ssl http2;
    # server_name 只能写 auth.gaubee.com。两个实测陷阱（2026-10-18）：
    # 1. 1pwaf 按匹配 server 块的 $server_name 识别站点，注册表（1pwaf/data/conf/sites.json）
    #    没有该名 → unknownWebsite 403。须把 auth.gaubee.com 加进 gaubee.com 条目的
    #    domains/host 数组（本次手工已加；建议在 1panel 面板站点域名里正式添加固化）。
    # 2. 不要写 "server_name gaubee.com auth.gaubee.com" 想复用主站注册——conf.d 字母序
    #    本文件先于 gaubee.com.conf 加载，会抢占 gaubee.com 精确名劫持主站（实测发生并回滚）。
    server_name auth.gaubee.com;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_http_version 1.1;

    location ^~ /.well-known/acme-challenge {
        allow all;
        root /usr/share/nginx/html;
    }

    location / {
        proxy_pass http://127.0.0.1:17090;
        proxy_read_timeout 60s;
        client_max_body_size 20m;
    }

    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }

    ssl_certificate /www/sites/gaubee.com/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/gaubee.com/ssl/privkey.pem;
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    error_page 497 https://$host$request_uri;
    add_header Strict-Transport-Security "max-age=31536000";
}
