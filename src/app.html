<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<!-- 启动屏：pure CSS，零 JS 依赖，HTML 解析即见。SPA hydrate 后由 JS 移除。 -->
		<div id="gaubee-boot">
			<div class="boot-logo">
				<img src="/pwa-192.png" alt="GaubeeOS" width="96" height="96" />
			</div>
		</div>
		<style>
			#gaubee-boot {
				position: fixed;
				inset: 0;
				z-index: 9999;
				display: flex;
				align-items: center;
				justify-content: center;
				background: #fff;
				transition: opacity 0.3s ease;
			}
			@media (prefers-color-scheme: dark) {
				#gaubee-boot {
					background: #1a1a1a;
				}
			}
			#gaubee-boot.fade-out {
				opacity: 0;
				pointer-events: none;
			}
			/* Logo：圆角包裹 + blur 呼吸光影动画 */
			.boot-logo {
				width: 96px;
				height: 96px;
				border-radius: 24px;
				overflow: hidden;
				position: relative;
				animation: boot-breathe 2.4s ease-in-out infinite;
			}
			.boot-logo img {
				width: 100%;
				height: 100%;
				object-fit: cover;
				display: block;
			}
			/* 光影层：用伪元素叠加 box-shadow 模拟呼吸光晕 */
			.boot-logo::after {
				content: '';
				position: absolute;
				inset: 0;
				border-radius: inherit;
				box-shadow: 0 0 0 0 rgba(255, 90, 54, 0);
				animation: boot-glow 2.4s ease-in-out infinite;
			}
			@keyframes boot-breathe {
				0%,
				100% {
					filter: blur(0px);
					transform: scale(1);
				}
				50% {
					filter: blur(1.5px);
					transform: scale(0.94);
				}
			}
			@keyframes boot-glow {
				0%,
				100% {
					box-shadow: 0 0 24px 2px rgba(255, 90, 54, 0.15);
				}
				50% {
					box-shadow: 0 0 48px 8px rgba(255, 90, 54, 0.35);
				}
			}
			@media (prefers-reduced-motion: reduce) {
				.boot-logo,
				.boot-logo::after {
					animation: none;
				}
			}
		</style>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
