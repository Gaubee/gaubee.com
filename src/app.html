<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<!-- 启动屏：pure CSS，零 JS 依赖，HTML 解析即见。SPA hydrate 后由 JS 移除。 -->
		<div id="gaubee-boot">
			<div class="boot-logo">
				<img src="/favicon-32.png" alt="GaubeeOS" width="48" height="48" />
			</div>
			<div class="boot-spinner"></div>
		</div>
		<style>
			#gaubee-boot {
				position: fixed;
				inset: 0;
				z-index: 9999;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 1.25rem;
				background: #fff;
				transition: opacity 0.3s ease;
			}
			@media (prefers-color-scheme: dark) {
				#gaubee-boot {
					background: #1a1a1a;
				}
			}
			#gaubee-boot.fade-out {
				opacity: 0;
				pointer-events: none;
			}
			.boot-logo {
				animation: boot-pulse 1.6s ease-in-out infinite;
			}
			.boot-spinner {
				width: 28px;
				height: 28px;
				border: 3px solid rgba(255, 90, 54, 0.2);
				border-top-color: #ff5a36;
				border-radius: 50%;
				animation: boot-spin 0.7s linear infinite;
			}
			@keyframes boot-spin {
				to {
					transform: rotate(360deg);
				}
			}
			@keyframes boot-pulse {
				0%,
				100% {
					opacity: 1;
				}
				50% {
					opacity: 0.5;
				}
			}
		</style>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
