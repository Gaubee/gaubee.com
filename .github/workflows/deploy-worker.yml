name: Deploy Auth Worker to Cloudflare

# 部署 Gaubee Auth Worker（GitHub OAuth + API 代理）到 Cloudflare Workers。
#
# 前置（在 GitHub Secrets 配置一次）：
#   - CLOUDFLARE_API_TOKEN：Cloudflare API Token（需 Workers Scripts:Edit 权限）
#   - CLOUDFLARE_ACCOUNT_ID：Cloudflare Account ID
#
# 前置（在本地一次性执行，敏感变量不入库不入 CI）：
#   cd worker && npx wrangler secret put GITHUB_CLIENT_ID --env production
#   cd worker && npx wrangler secret put GITHUB_CLIENT_SECRET --env production
#
# Worker 生产域名 / APP_ORIGIN / OAuth 回调 URL 在 worker/wrangler.toml [env.production.vars] 配置。

on:
  push:
    branches:
      - main
    paths:
      - worker/**
      - .github/workflows/deploy-worker.yml
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Worker dependencies
        working-directory: worker
        # npm ci（lockfile 入库）：npm10 的 Arborist 在裸 install 上有 edgesOut null bug（2026-10-07 CI 实证）
        run: npm ci

      # 部署门：geo 路由单测（cdn-media Phase 2 起，红则不发布）
      - name: Run worker tests
        working-directory: worker
        run: npm test

      # 守卫：KV id 占位符未替换（cdn-media Phase 2 用户待办）时跳过部署——
      # 占位符下部署会让 geo 规则存储指向不存在的 namespace。替换真实 id 后此步自动恢复部署。
      - name: Guard - skip deploy while KV placeholder present
        working-directory: worker
        run: |
          if grep -q "PLACEHOLDER_CREATE_BEFORE_DEPLOY" wrangler.toml; then
            echo "::warning::wrangler.toml 仍含 GEO_RULES KV 占位符（创建 namespace 后填入真实 id），本次跳过部署"
            echo "SKIP_DEPLOY=1" >> "$GITHUB_ENV"
          fi

      - name: Deploy to Cloudflare Workers
        if: env.SKIP_DEPLOY != '1'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          environment: production
          # package.json 的 deploy 脚本 = wrangler deploy，wrangler-action 默认也跑 deploy
          command: deploy
