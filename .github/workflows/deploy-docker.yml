# ---------------------------------------------------------------------------
# 构建静态站镜像并推送镜像仓库（备案合规：国内服务器 docker 部署）。
#
# 触发：main 分支 push（合并 feature 分支后）+ 手动 workflow_dispatch
# 双仓库发布：
#   - GHCR（默认，始终推送）：ghcr.io/gaubee/gaubee.com:latest（+ sha 短码 tag）
#   - Docker Hub（可选）：docker.io/<DOCKERHUB_USERNAME>/gaubee.com
#     需配置 repo secrets：DOCKERHUB_USERNAME + DOCKERHUB_TOKEN（Docker Hub
#     → Account Settings → Security → New Access Token，Read/Write 权限）。
#     未配置时该步骤自动跳过，CI 保持绿。
# 服务器侧：docker-compose.yml 直接引用镜像，pull && up -d 即更新。
#
# 与 Pages 部署（main.yml）并行不悖：Pages 保留作为境外/备用入口，
# 主域名 DNS 由用户自行切换到国内服务器（备案合规要求）。
# ---------------------------------------------------------------------------

name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # secrets context 不能直接用于 step if（Unrecognized named-value），
    # 经 job env 中转后用 env 比较（官方推荐模式）。
    env:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      PANEL_WEBHOOK_URL: ${{ secrets.PANEL_WEBHOOK_URL }}
      WATCHTOWER_WEBHOOK_URL: ${{ secrets.WATCHTOWER_WEBHOOK_URL }}
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify VITE_AUTH_BASE
        # 防回退（与 main.yml 同逻辑）：镜像内前端的 OAuth 跳转目标必须显式生产值。
        # Dockerfile 默认值即生产 Worker 域名，此处校验 secret 一致性；
        # 未配置 secret 时使用默认值跳过（镜像构建走 Dockerfile 内置校验）。
        env:
          VITE_AUTH_BASE: ${{ secrets.VITE_AUTH_BASE }}
        run: |
          if [[ -n "$VITE_AUTH_BASE" && ! "$VITE_AUTH_BASE" =~ ^https:// ]]; then
            echo "::error::VITE_AUTH_BASE 必须是 https:// 开头（当前：'$VITE_AUTH_BASE'）。"
            exit 1
          fi

      # ---- GHCR（默认通道，GITHUB_TOKEN 免配置）----
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: GHCR metadata (tags, labels)
        id: meta-ghcr
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/gaubee.com
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64 # 国内服务器主流架构；需 arm64 再扩展
          push: true
          build-args: |
            VITE_AUTH_BASE=${{ secrets.VITE_AUTH_BASE || 'https://auth.gaubee.com' }}
          tags: ${{ steps.meta-ghcr.outputs.tags }}
          labels: ${{ steps.meta-ghcr.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- Docker Hub（可选通道，配置 secrets 后自动启用）----
      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Hub metadata (tags, labels)
        id: meta-dockerhub
        if: ${{ env.DOCKERHUB_TOKEN != '' }}
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/gaubee.com
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Push to Docker Hub
        # 复用上一步的 GHA layer 缓存，第二次构建秒级完成
        if: ${{ env.DOCKERHUB_TOKEN != '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_AUTH_BASE=${{ secrets.VITE_AUTH_BASE || 'https://auth.gaubee.com' }}
          tags: ${{ steps.meta-dockerhub.outputs.tags }}
          labels: ${{ steps.meta-dockerhub.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- 服务器自动拉取通知（二选一或都配，均未配则跳过）----
      # 通道 A（不依赖 1Panel，推荐）：服务器 compose 里跑 watchtower sidecar
      #   （挂 docker.sock，--http-api-enable + token），把
      #   http://<server>:<port>/v1/update 配为 secret WATCHTOWER_WEBHOOK_URL。
      #   watchtower 收到 POST 立即 pull + recreate；即使不配此 secret，
      #   watchtower 的 --interval 轮询也是兜底（延迟 <= interval）。
      # 通道 B（1Panel）：计划任务（pull && up -d）开 Webhook，配 secret PANEL_WEBHOOK_URL。
      # 注意：镜像推送后 registry 元数据偶有索引延迟，通知侧带 sleep + 重试兜底。
      - name: Notify server to pull
        if: ${{ env.PANEL_WEBHOOK_URL != '' || env.WATCHTOWER_WEBHOOK_URL != '' }}
        run: |
          sleep 10   # 等 registry 元数据可见
          ok=1
          if [[ -n "$WATCHTOWER_WEBHOOK_URL" ]]; then
            curl -fsS --retry 3 --retry-delay 5 -X POST "${{ env.WATCHTOWER_WEBHOOK_URL }}" \
              && echo "已通知 watchtower 拉取" || { echo "::warning::watchtower 通知失败（轮询兜底会补）"; ok=0; }
          fi
          if [[ -n "$PANEL_WEBHOOK_URL" ]]; then
            curl -fsS --retry 3 --retry-delay 5 "${{ env.PANEL_WEBHOOK_URL }}" \
              && echo "已通知 1Panel 计划任务拉取" || { echo "::warning::1Panel webhook 失败"; ok=0; }
          fi
          [ $ok -eq 1 ] || true
