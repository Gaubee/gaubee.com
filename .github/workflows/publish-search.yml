# ---------------------------------------------------------------------------
# 构建并推送语义搜索服务镜像（zvec + E5-small ONNX）。
#
# 触发：
#   - main push，且改动涉及 search-server/** 或 src/content/**（内容变更需要重建索引）
#   - 手动 workflow_dispatch
#
# 产物：ghcr.io/gaubee/gaubee-search:latest（+ sha 短码 tag）
# 服务器侧：compose 里 search-server 服务直接 pull 该镜像；索引与模型都烘进镜像，
# 启动即就绪，不在运行容器里重建。
#
# 注意：
#   - 构建上下文必须是仓库根目录（Dockerfile 需要 src/content）。
#   - 模型下载与 zvec SDK 都在 Dockerfile 内做 sha256 校验。
#   - 首次构建约 5 分钟；GHA layer cache 会缓存模型/SDK 层。
# ---------------------------------------------------------------------------

name: Build and Push Search Server Image

on:
  push:
    branches:
      - main
    paths:
      - "search-server/**"
      - "src/content/**"
      - ".github/workflows/publish-search.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: search-server-publish
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/gaubee-search
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: search-server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
