# gaubee.com 静态站 nginx 配置（容器内 80 端口）。
# 产物结构（adapter-static，fallback=index.html）：
#   /index.html            SPA 入口（编辑器，NavController 客户端路由）
#   /pages/**              SSG 阅读站（目录式 pages/archive/index.html + 扁平式 pages/archive.html 双格式）
#   /pages/raw/**.md       原始 markdown 端点（text/markdown）
#   /_app/immutable/**     vite 带哈希的不可变资产
#   /sw.js                 Service Worker（必须禁缓存，保证更新检查生效）

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # 默认禁强缓存：HTML/SW/搜索索引等内容一律协商缓存
  # （ETag/Last-Modified 变化即取新内容，发布即时生效）。
  # 注意 try_files 中间参数命中时不重走 location 匹配，
  # 故 no-cache 必须放 server 级，而不是拆在 .html$ location 里。
  # 下方 immutable location 有自己的 add_header，会覆盖此默认值。
  add_header Cache-Control "no-cache";

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types
    text/plain
    text/css
    text/markdown
    text/javascript
    application/json
    application/javascript
    application/xml
    application/manifest+json
    image/svg+xml;

  # SPA + SSG 双格式兜底：
  # 1. 精确文件（SSG html / md / 资产）
  # 2. 目录 index.html（pages/archive/）
  # 3. 扁平 .html（pages/archive.html）
  # 4. SPA fallback（/app/... 等客户端路由；未知路径由 SPA 渲染 NotFound）
  location / {
    try_files $uri $uri/index.html $uri.html /index.html;
  }

  # vite 不可变资产：文件名带内容哈希，可永久缓存（覆盖 server 级默认）
  location /_app/immutable/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # raw markdown 端点显式 MIME（nginx 默认 mime.types 对 .md 不可靠）
  location ~ \.md$ {
    default_type text/markdown;
  }
}
