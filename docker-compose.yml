# ---------------------------------------------------------------------------
# gaubee.com 国内服务器部署（备案合规）。
#
# 服务器用法（镜像由 CI 自动推送到 GHCR，无需本地构建）：
#   1. 保存本文件到服务器任意目录（如 /opt/gaubee.com/）
#   2. docker compose pull && docker compose up -d
#   3. 外层用你自己的 nginx/caddy 反代 8080 → 443 + TLS 证书
#      （或 PORT=80 直接对外，再由云厂商/防火墙管 443）
#
# 更新：git pull（或重新下载本文件）→ docker compose pull && docker compose up -d
# ---------------------------------------------------------------------------

services:
  web:
    # 默认 GHCR 镜像；若服务器配置了 Docker Hub 加速器，可切换为：
    #   image: docker.io/<你的DockerHub用户名>/gaubee.com:latest
    image: ghcr.io/gaubee/gaubee.com:latest
    container_name: gaubee-com
    restart: unless-stopped
    ports:
      # 宿主端口可用 PORT 环境变量覆盖（默认 8080，避免与宿主已有 nginx 冲突）
      - "${PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/pages"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
