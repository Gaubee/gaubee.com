#:schema node_modules/wrangler/config-schema.json
name = "gaubee-auth"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# 环境变量（非敏感，可提交）：
# - APP_ORIGIN：静态站点的 origin，CORS 与重定向白名单用。部署时设置。
# - ENVIRONMENT：dev 时允许 localhost CORS；生产设为 "production" 严格白名单。
# - OWNER_LOGIN：/api/geo/rules 写接口的 owner GitHub login（worker/src/geo.ts 校验用）。
# 敏感变量（GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET）用 wrangler secret put 设置，不入库。
[vars]
# 本地开发：前端经 portless 暴露为 https://gaubee.com.localhost，Worker 经 vite proxy 同源转发。
# APP_ORIGIN：OAuth 成功后重定向回前端的 origin（worker/src/index.ts 的回调 redirect 用）。
# WORKER_ORIGIN：构造 OAuth redirect_uri 的 origin（反代下 c.req.url 不可靠，必须显式指定）。
# 本地因 vite proxy，/auth/github/callback 经前端同源地址转发到 Worker，故 WORKER_ORIGIN = 前端 portless URL。
APP_ORIGIN = "https://gaubee.com.localhost"
WORKER_ORIGIN = "https://gaubee.com.localhost"
ENVIRONMENT = "dev"
OWNER_LOGIN = "gaubee"

# geo 规则单写入器 Durable Object（cdn-media Phase 2，r10 P1-1）：版本单调判定收敛进 DO
# 串行执行，替代原 GEO_RULES KV——KV 无 compare-and-swap，并发 owner 写可双双 200 后写覆盖。
# DO 无占位符 id（worker/src/geo.ts 以 idFromName("geo-rules") 寻址，workerd 按 name 派生 id），
# 类由下方 migrations 在首次部署时自动创建，无任何部署前手动资源步骤。
[durable_objects]
bindings = [
  { name = "GEO_RULES_DO", class_name = "GeoRulesDO" },
]

# Durable Object 迁移账本：new_sqlite_classes 只增不改（已发布的 tag 不可重放或改名）；
# 必须用 sqlite 变体——free plan 拒绝 new_classes（API 10097，CI run 37581484857 实证，
# 收据见 deploy/cdn-base-rollout.md 第 1 节）；顶层 migrations 对所有 env（含 production）生效。
[[migrations]]
tag = "v1"
new_sqlite_classes = ["GeoRulesDO"]

# 生产环境配置（CI 用 wrangler deploy --env production 触发）：
# APP_ORIGIN 必须与静态站（GitHub Pages）实际域名一致，用于 CORS 与 OAuth 回调重定向。
# WORKER_ORIGIN 是生产 Worker 的对外域名（用于构造 OAuth redirect_uri）。
# 部署前请确认下面几个值与你的实际域名匹配（WORKER_ORIGIN 用你选定的 Worker 域名，含 https 无尾斜杠）。
[env.production.vars]
APP_ORIGIN = "https://gaubee.com"
WORKER_ORIGIN = "https://auth.gaubee.com"
ENVIRONMENT = "production"
OWNER_LOGIN = "gaubee"

# 生产 geo 规则 DO：durable_objects 不随顶层配置继承（与原 kv_namespaces 同规则），per-env 必须重申。
[env.production.durable_objects]
bindings = [
  { name = "GEO_RULES_DO", class_name = "GeoRulesDO" },
]

# 头像反代自定义域（2026-10-18 kzf 裁决：头像域名迁 tweb.xin）：
# auth.gaubee.com 的 Custom Domain 因 gaubee.com zone 2026-08-15 迁往阿里云 DNS 已失效
# （CF 边缘无证书，全球 TLS alert 40），头像域名改挂 tweb.xin（同账号 zone，国内可达已实测）。
# /twimg/ 路由对 hostname 不敏感，同一 Worker 可同时服务多个自定义域。
[[env.production.routes]]
pattern = "twimg.tweb.xin"
custom_domain = true

# ===== 三方一致性检查清单（改动任一处，必须同步其余两处）=====
# Worker 用 WORKER_ORIGIN 构造 GitHub OAuth 的 redirect_uri，故下面三处的「Worker 域名」必须相同：
#   1. 本文件上方 WORKER_ORIGIN                          （Worker 自身认知）
#   2. 前端构建注入的 VITE_AUTH_BASE（GitHub Secret）    （前端跳转目标）
#   3. GitHub OAuth App 的 Authorization callback URL    （GitHub 回跳目标）
# 当前 Worker 域名：https://auth.gaubee.com
#   callback URL 须为：https://auth.gaubee.com/auth/github/callback
#
# 域名机制（2026-10-18 更新）：OAuth/上传已自托管到源站（auth-server/，openresty 反代
# 127.0.0.1:17090），auth.gaubee.com 域名不变故三方清单仍成立；本 Worker 只剩头像反代，
# 自定义域为 twimg.tweb.xin（上方 routes 声明）。历史教训：不可用裸 CNAME 指向 *.workers.dev
# ——workers.dev 默认域的证书不覆盖 CNAME 进来的自定义主机名（2026-08-15 DNS 迁阿里云时
# 即因该形态导致 auth 域全球 TLS 失败两个月）。

# 本地开发：wrangler dev 默认 http://localhost:8787
# 生产：auth.gaubee.com（Workers Custom Domain）
